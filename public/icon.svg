<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#090d16" />
        <stop offset="50%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#020617" />
      </linearGradient>
      <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="50%" stop-color="#0284c7" />
        <stop offset="100%" stop-color="#6366f1" />
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="100%" stop-color="#a855f7" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Background -->
    <rect width="512" height="512" rx="112.64" fill="url(#bg)" />
    
    <!-- Subtle tech accent rings -->
    <circle cx="256" cy="256" r="214.016" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8" />
    <circle cx="256" cy="256" r="168.96" fill="none" stroke="#0284c7" stroke-opacity="0.15" stroke-width="1.5" />

    <g transform="translate(30.72, 30.72) scale(0.88)">
      <!-- Glow effect backdrop -->
      <path d="M 112.64 399.36 
               L 112.64 133.12 
               L 256 286.72 
               L 399.36 133.12 
               L 399.36 399.36"
            fill="none" 
            stroke="#0284c7" 
            stroke-width="40.96" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.4"
            filter="url(#glow)" />

      <!-- Main "M" / Mythos Knowledge Monogram -->
      <path d="M 112.64 399.36 
               L 112.64 133.12 
               L 256 286.72 
               L 399.36 133.12 
               L 399.36 399.36"
            fill="none" 
            stroke="url(#primary)" 
            stroke-width="33.28" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Center Lore Crystal / Quill tip -->
      <polygon points="256,143.36 286.72,194.56 256,245.76 225.28,194.56" 
               fill="url(#accent)" />
      
      <!-- Tech connection dots -->
      <circle cx="112.64" cy="399.36" r="17.92" fill="#38bdf8" />
      <circle cx="399.36" cy="399.36" r="17.92" fill="#818cf8" />
      <circle cx="256" cy="286.72" r="14.336" fill="#e0f2fe" />
    </g>
  </svg>