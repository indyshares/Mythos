    <script>
      // Suppress harmless Vite HMR WebSocket disconnect messages in container preview
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket closed without opened') || (event.message?.includes('WebSocket') && event.filename?.includes('@vite/client')))) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason?.message || event.reason || '');
        if (typeof reason === 'string' && (reason.includes('WebSocket closed without opened') || reason.includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
